name: tiger-geocoder

services:
  db:
    build:
      context: .
      args:
        PG_MAJOR: "${PG_MAJOR:-18}"
        POSTGIS_MAJOR: "${POSTGIS_MAJOR:-3.6}"
        TIGER_GEOCODER_VERSION: "${TIGER_GEOCODER_VERSION:-2025.2}"
    image: tagadvance/tiger-geocoder:${TAG:-dev}
    # Parallel workers allocate dynamic shared memory from /dev/shm, and
    # tiger-tune scales the worker pools with the core count, so this has to
    # have room to grow. Docker's 64m default is nowhere near enough.
    shm_size: 4gb
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-geocoder}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      PGDATABASE: "${POSTGRES_DB:-geocoder}"
      TIGER_STATES: "${TIGER_STATES:-}"
      TIGER_WEBSITE_ROOT: "${TIGER_WEBSITE_ROOT:-}"
      # load  -- bulk ingest; trades crash safety for write throughput.
      # serve -- read-mostly geocoding; durable settings only.
      # Switch to serve once the data is in and you want a system of record.
      TIGER_TUNE_PROFILE: "${TIGER_TUNE_PROFILE:-load}"
      TIGER_TUNE: "${TIGER_TUNE:-true}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Bind mounts, not named volumes, so the loaded database is a directory
      # you can rsync to another machine.
      #
      # PostgreSQL 18 images mount /var/lib/postgresql, not .../data: the server
      # then keeps its cluster in a major-version subdirectory (18/docker), which
      # is what lets a future `pg_upgrade --link` to PG19 run without crossing a
      # mount boundary. Mounting the old path is a hard error on these images.
      - ./data:/var/lib/postgresql
      - ./gisdata:/gisdata
    # No `command:` here on purpose. Settings are computed at startup by
    # tiger-tune, from the memory and cores this container can actually see, so
    # the same file is reasonable on a laptop and on a 16-core server. Pinned
    # megabyte counts are either too small for the big host or fail to start on
    # the small one.
    #
    # To override one setting, add it back as a command; the entrypoint puts the
    # computed flags first and PostgreSQL honours the last `-c` for a setting:
    #
    #     command: [postgres, -c, shared_buffers=24GB]
    #
    # `docker compose logs db | grep tiger-tune` shows what was applied.
    # Checking pg_isready alone is not enough. If an initdb hook fails, the
    # entrypoint aborts, restart policy brings the container back, the now
    # non-empty data directory makes it skip initialization -- and a database
    # missing every extension reports healthy forever. Prove the schema landed.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --quiet --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}
          && psql --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}
          --no-align --tuples-only --set ON_ERROR_STOP=1
          --command "SELECT 1 WHERE to_regproc('api.coverage') IS NOT NULL"
          | grep --quiet 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
